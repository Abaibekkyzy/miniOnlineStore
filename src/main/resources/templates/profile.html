<!DOCTYPE html>
<html lang="en" xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html" xmlns:sec="http://www.w3.org/1999/xhtml">

    <div layout:fragment="content">

            <div class="col-4 profile-card">
                <h2>My Profile</h2>
                <p class="text-muted">Manage your personal information</p>

                <input type="hidden" id="userId">

                <div class="mb-3">
                    <label for="fullNameDetails" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullNameDetails">
                </div>

                <div class="mb-3">
                    <label for="emailDetails" class="form-label">Email</label>
                    <input type="email" class="form-control" id="emailDetails">
                </div>

                <button type="button" class="btn btn-dark"
                        onclick="updateUserProfile()">
                    SAVE CHANGES
                </button>
            </div>

            <script type="text/javascript">


                function updateUserProfile() {
                    const email = document.getElementById("emailDetails").value.trim();
                    const fullName = document.getElementById("fullNameDetails").value.trim();

                    const httpRequest = new XMLHttpRequest();
                    httpRequest.open("PUT", "/user/profile", true);
                    httpRequest.setRequestHeader("Content-Type", "application/json");

                    httpRequest.onreadystatechange = function () {
                        if (httpRequest.readyState === XMLHttpRequest.DONE) {
                            if (httpRequest.status === 200) {
                                alert("Profile updated successfully!");
                            } else {
                                alert("Update failed: " + httpRequest.status);
                                console.log(httpRequest.responseText);
                            }
                        }
                    };

                    const body = {
                        fullName: fullName,
                        email: email
                    };

                    httpRequest.send(JSON.stringify(body));
                }

                function loadUserProfile() {
                    fetch("/user/me")
                        .then(response => {
                            if (!response.ok) {
                                throw new Error("Profile could not be loaded");
                            }
                            return response.json();
                        })
                        .then(user => {
                            document.getElementById("userId").value = user.id;
                            document.getElementById("fullNameDetails").value = user.fullName;
                            document.getElementById("emailDetails").value = user.email;
                        })
                        .catch(error => {
                            console.error(error);
                            alert("Could not load your profile");
                        });
                }

                loadUserProfile();




            </script>
    </div>

</html>

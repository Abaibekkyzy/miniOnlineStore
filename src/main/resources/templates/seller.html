<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="layout.html">

    <div layout:fragment="content" class="seller-page">

        <input type="hidden" id="productId">

        <div class="row mb-3" sec:authorize="hasAnyRole('ROLE_SELLER', 'ROLE_ADMIN')">
            <div class="col-5 mx-auto seller-form-card">
                <div class="row mt-3">
                    <div class="col-12">
                        <label>NAME</label>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <input type="text" class="form-control" id="productName">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <label>DESCRIPTION</label>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <textarea class="form-control" id="description"></textarea>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <label>PRICE</label>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <input type="text" class="form-control" id="price">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <label>QUANTITY</label>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <input type="text" class="form-control" id="quantity">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <label>CODE</label>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <input type="text" class="form-control" id="code">
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-12">
                        <button class="btn btn-secondary" onclick="addProduct()"> ADD PRODUCT</button>
                    </div>
                </div>
            </div>

            <script type="text/javascript">
                function addProduct(){
                    const httpRequest = new XMLHttpRequest();
                    httpRequest.open("POST", "/product", true);
                    httpRequest.setRequestHeader("Content-Type", "application/json");

                    let productName = document.getElementById("productName");
                    let description = document.getElementById("description");
                    let price = document.getElementById("price");
                    let code = document.getElementById("code");
                    let quantity = document.getElementById("quantity");

                    httpRequest.onreadystatechange = function (){
                        if(httpRequest.readyState == XMLHttpRequest.DONE && httpRequest.status == 200){
                            productName.value = "";
                            description.value = "";
                            price.value = "";
                            code.value = "";
                            quantity.value = "";
                            loadProducts();
                        }
                    };

                    let body = {
                        "productName": productName.value,
                        "description": description.value,
                        "price": price.value,
                        "code": code.value,
                        "quantity": quantity.value
                    };
                    body = JSON.stringify(body);

                    httpRequest.send(body);
                }
            </script>

        </div>

        <div class="col-12">
            <div class="seller-table-wrap">
                <table class="table seller-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NAME</th>
                            <th>DESCRIPTION</th>
                            <th>PRICE</th>
                            <th style="width: 10%">DETAILS</th>
                        </tr>
                    </thead>
                    <tbody id="productListBody">

                    </tbody>
                </table>

                <!-- Modal -->
                <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                    <div class="modal-dialog">

                        <div class="modal-content" sec:authorize="hasAnyRole('ROLE_SELLER', 'ROLE_ADMIN')">

                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="staticBackdropLabel">Product Details</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="col-6 mx-auto">
                                    <div class="row mt-3">
                                        <div class="col-12">
                                            <label>NAME</label>
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <input type="text" class="form-control" id="titleDetails">
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-12">
                                            <label>DESCRIPTION</label>
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <textarea class="form-control" id="descriptionDetails"></textarea>
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-12">
                                            <label>PRICE</label>
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <input type="number" class="form-control" id="priceDetails">
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-12">
                                            <label>CODE</label>
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <input type="number" class="form-control" id="codeDetails">
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col-12">
                                            <label>QUANTITY</label>
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <input type="number" class="form-control" id="quantityDetails">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-danger" onclick="deleteProduct()">DELETE</button>
                                <button type="button" class="btn btn-primary" onclick="updateProduct()">SAVE</button>
                            </div>

                            <script type="text/javascript">
                                function updateProduct(){
                                    const httpRequest = new XMLHttpRequest();
                                    httpRequest.open("PUT", "/product", true);
                                    httpRequest.setRequestHeader("Content-Type", "application/json");

                                    let productId = document.getElementById("productId");
                                    let title = document.getElementById("titleDetails");
                                    let description = document.getElementById("descriptionDetails");
                                    let price = document.getElementById("priceDetails");
                                    let quantity = document.getElementById("quantityDetails");
                                    let code = document.getElementById("codeDetails");

                                    httpRequest.onreadystatechange = function () {
                                        if (httpRequest.readyState === XMLHttpRequest.DONE) {
                                            console.log("Status:", httpRequest.status);
                                            console.log("Response:", httpRequest.responseText);

                                            if (httpRequest.status === 200) {
                                                loadProducts();
                                                detailsModal.hide();
                                            } else {
                                                alert("Update failed! Status: " + httpRequest.status);
                                            }
                                        }
                                    };

                                    let body = {
                                        "id": productId.value,
                                        "productName" : title.value,
                                        "description" : description.value,
                                        "price" : price.value,
                                        "quantity" : quantity.value,
                                        "code" : code.value
                                    };
                                    body = JSON.stringify(body);
                                    httpRequest.send(body);
                                }

                                function deleteProduct(){

                                    let approve = confirm("are you sure?");
                                    if(approve){

                                        let productId = document.getElementById("productId");

                                        const httpRequest = new XMLHttpRequest();
                                        httpRequest.open("DELETE", "/product/"+productId.value, true);
                                        httpRequest.setRequestHeader("Content-Type", "application/json");

                                        httpRequest.onreadystatechange = function (){
                                            if(httpRequest.readyState == XMLHttpRequest.DONE && httpRequest.status == 200){
                                                detailsModal.hide();
                                                loadProducts();
                                            }
                                        };
                                        httpRequest.send();
                                    }
                                }
                            </script>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script type="text/javascript">

            loadProducts();

            function loadProducts(){

                const httpRequest = new XMLHttpRequest();
                httpRequest.open( "GET", "/product", true);
                httpRequest.onreadystatechange = function (){
                    if(httpRequest.readyState ==XMLHttpRequest.DONE&& httpRequest.status==200){

                        let productList = JSON.parse(httpRequest.responseText);

                        let tableContent = "";
                        for(let i=0; i<productList.length; i++){
                            tableContent+="<tr>";
                            tableContent+="<td>"+productList[i].id+"</td>";
                            tableContent+="<td>"+productList[i].productName+"</td>";
                            tableContent+="<td>"+productList[i].description+"</td>";
                            tableContent+="<td>"+productList[i].price+"</td>";
                            tableContent+="<td><button class='btn btn-primary btn-sm' " +
                                "onclick='openProductDetailsModal("+productList[i].id+")'>DETAILS</button></td>";
                            tableContent+="</tr>";
                        }
                        document.getElementById("productListBody").innerHTML = tableContent;
                    }
                }
                httpRequest.send();
            }

            function openProductDetailsModal(id){
                detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));

                const httpRequest = new XMLHttpRequest();
                httpRequest.open( "GET", "/product/"+id, true);
                httpRequest.onreadystatechange = function (){
                    if(httpRequest.readyState ==XMLHttpRequest.DONE&& httpRequest.status==200){
                        let result = JSON.parse(httpRequest.responseText);
                        titleDetails.value = result.productName;
                        descriptionDetails.value = result.description;
                        priceDetails.value = result.price;
                        codeDetails.value = result.code;
                        quantityDetails.value = result.quantity;
                        productId.value = result.id;
                        detailsModal.show();
                    }
                }
                httpRequest.send();
            }

        </script>

    </div>
</html>

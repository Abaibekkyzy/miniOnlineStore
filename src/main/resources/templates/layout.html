<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <link rel="stylesheet" type="text/css"
              th:href="@{'/css/bootstrap.css'}">
    </head>
    <body>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark">
            <div class="container-fluid">

                <a class="navbar-brand" th:href="@{/}">
                    Online store
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarMenu"
                        aria-controls="navbarMenu"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">Home</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link" th:href="@{/sign-in-page}">
                                Sign in
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link" th:href="@{/sign-up-page}">
                                Sign up
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN')">
                            <a class="nav-link" th:href="@{/admin-panel}">
                                Admin
                            </a>
                        </li>

                        <li class="nav-item" sec:authorize="hasAnyRole('ROLE_TEACHER')">
                            <a class="nav-link" th:href="@{/teacher-panel}">
                                Manager
                            </a>
                        </li>

                        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                            <a class="nav-link dropdown-toggle" href="#" role="button"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <span th:text="${#authentication.principal.fullName}"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" th:href="@{/update-password-page}">Update password</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/sign-out}" method="post">
                                        <button class="dropdown-item">Sign out</button>
                                    </form>
                                </li>
                            </ul>
                        </li>

                    </ul>

                    <form class="d-flex" role="search">
                        <input class="form-control me-2"
                               type="search"
                               placeholder="Search"
                               aria-label="Search">

                        <button class="btn btn-outline-light" type="submit">
                            Search
                        </button>
                    </form>
                </div>

            </div>
        </nav>
        <div class="container mt-5">
            <div class="row">
                <div class="col-12">
                    <div layout:fragment="content">
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script type = "text/javascript" th:src = "@{'/js/bootstrap.bundle.js'}"></script>
</html>

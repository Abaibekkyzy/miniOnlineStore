<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>yepstore</title>
        <link rel="stylesheet" type="text/css"
              th:href="@{'/css/bootstrap.css'}">
        <style>
            .navbar {
                background-color: #ffffff;
                padding: 22px 4%;
                min-height: 90px;
            }

            .navbar-brand {
                font-family: Georgia, serif;
                font-size: 34px;
                letter-spacing: -1.2px;
                color: #211e1b !important;
            }

            .navbar-nav {
                gap: 28px;
            }

            .navbar-nav .nav-link {
                color: #211e1b !important;
                font-size: 13px;
                letter-spacing: 1.2px;
                text-transform: uppercase;
            }

            .navbar-nav .nav-link:hover {
                color: #a49a8e !important;
            }

            .navbar .container-fluid {
                padding: 0;
            }

            .search-form {
                gap: 8px;
            }

            .search-form .form-control {
                border: none;
                border-bottom: 1px solid #d8d3cd;
                border-radius: 0;
                font-size: 12px;
                box-shadow: none;
                background: transparent;
            }

            .search-form .form-control:focus {
                border-bottom-color: #211e1b;
            }

            .search-button {
                border: 1px solid #211e1b;
                background: #211e1b;
                color: white;
                padding: 8px 14px;
                font-size: 11px;
                letter-spacing: 1px;
                text-transform: uppercase;
                transition: .3s;
                border-radius: 10px;
            }

            .search-button:hover {
                background: white;
                color: #211e1b;
            }
            .signin-title {
                font-family: Georgia, serif;
                font-size: 46px;
                font-weight: 400;
                color: #211e1b;
            }

            .signin-subtitle {
                color: #89847e;
                font-size: 18px;
            }

            .signin-form label {
                font-size: 15px;
                letter-spacing: 1.2px;
                color: #211e1b;
            }

            .signin-form .form-control {
                min-height: 56px;
                border: 1px solid #dedad5;
                box-shadow: none;
                font-size: 16px;
                padding: 12px 15px;
                border-radius: 12px;
                border-radius: 12px;
            }

            .signin-form .form-control:focus {
                border-color: #211e1b;
            }

            .signin-button {
                width: 100%;
                min-height: 56px;
                border: 1px solid #211e1b;
                border-radius: 0;
                background: #211e1b;
                color: white;
                font-size: 15px;
                letter-spacing: 2px;
                transition: .3s;
                border-radius: 12px;
            }

            .signin-button:hover {
                background: white;
                color: #211e1b;
            }

            .user-dropdown {
                border: 1px solid #dedad5;
                border-radius: 12px;
                padding: 10px 16px !important;
                transition: .3s;
            }

            .user-dropdown:hover {
                background-color: #f8f6f3;
            }

            .product-image {
                height: 240px;
                overflow: hidden;
                background: #f5f1ec;
            }

            .product-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .product-bottom {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .product-add-btn {
                width: 42px;
                height: 42px;
                border: none;
                border-radius: 50%;
                background: #211e1b;
                color: white;
                font-size: 27px;
                font-weight: 300;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: .3s;
            }

            .product-add-btn:hover {
                background: #a49a8e;
                transform: rotate(90deg);
            }

            /* Seller form */

            .seller-form-card .form-control {
                border: 1px solid #dedad5;
                border-radius: 9px;
                padding: 12px;
                box-shadow: none;
            }



            /* Seller table */

            .seller-table th {
                background: #f8f6f3;
                color: #6d655d;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .seller-table th,
            .seller-table td {
                padding: 14px 12px;
                border-color: #eee9e3;
            }

            .seller-table .btn {
                border-radius: 8px;
            }

        </style>
    </head>

    <body>


        <nav class="navbar navbar-expand-md navbar-light">
            <div class="container-fluid">

                <a class="navbar-brand" th:href="@{/}">
                    YEPSTORE
                </a>

                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">Home</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link" th:href="@{/sign-in-page}">
                                Sign in
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link" th:href="@{/sign-up-page}">
                                Sign up
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN')">
                            <a class="nav-link" th:href="@{/admin-panel}">
                                Admin
                            </a>
                        </li>

                        <li class="nav-item" sec:authorize="hasAnyRole('ROLE_SELLER', 'ROLE_ADMIN')">
                            <a class="nav-link" th:href="@{/seller-panel}">
                                Seller page
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/profile}">Profile</a>
                        </li>

                        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                            <a class="nav-link dropdown-toggle user-dropdown" href="#" role="button"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <span th:text="${#authentication.principal.fullName}"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" th:href="@{/update-password-page}">Update password</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/sign-out}" method="post">
                                        <button class="dropdown-item">Sign out</button>
                                    </form>
                                </li>
                            </ul>
                        </li>

                    </ul>

                    <form class="d-flex search-form" role="search" th:action = "@{'/'}">
                        <input class="form-control me-2"
                               type="search" placeholder="Search"
                               aria-label="Search" name = "key"
                               th:value = "${param.key!=null?param.key:''}">
                        <button class="search-button" type="submit">Search</button>
                    </form>
                </div>

            </div>
        </nav>

        <div class="container mt-5">
            <div class="row">
                <div class="col-12">
                    <div layout:fragment="content">

                    </div>
                </div>
            </div>
        </div>
    </body>

    <script type = "text/javascript" th:src = "@{'/js/bootstrap.bundle.js'}">


    </script>
</html>

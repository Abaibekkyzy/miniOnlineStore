<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">

    <div layout:fragment="content">
        <div class="row">
            <div class="col-12 col-md-5 col-lg-4 mx-auto">

                <div class="text-center mb-4">
                    <h1 class="signin-title">Welcome back</h1>
                    <p class="signin-subtitle">Sign in to your account</p>
                </div>

                <div class="alert alert-danger alert-dismissible fade show" role="alert"
                     th:if="${param.autherror!=null}">
                     Incorrect email!
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form class="signin-form" method="post" th:action="@{'/to-enter'}">
                    <div class="row">
                        <div class="col-12">
                            <label>EMAIL :</label>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-12">
                            <input type="email" class="form-control" required placeholder="Email" name="user_email">
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <label>PASSWORD :</label>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-12">
                            <input type="password" class="form-control" required placeholder="Password" name="user_password">
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <button class="signin-button" type="submit">SIGN IN</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</html>

<!DOCTYPE html>
<html lang="en"  xmlns:th=" http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="layout.html">

    <div layout:fragment="content">
        <input type="hidden" id="courseId">

        <div class="text-center mb-4" sec:authorize="!isAuthenticated()">
            <h1 class="signin-title">Welcome back</h1>
            <p class="signin-subtitle">Sign in to your account</p>
        </div>

        <div class="row mt-3">
            <div class="row g-4" id="productList">
            </div>
        </div>

        <script type="text/javascript">
            loadProducts();
            function loadProducts(){
                const httpRequest = new XMLHttpRequest();
                httpRequest.open( "GET", "/product", true);
                httpRequest.onreadystatechange = function (){
                    if(httpRequest.readyState ==XMLHttpRequest.DONE&& httpRequest.status==200){
                        let productList = JSON.parse(httpRequest.responseText);
                        let tableContent = "";
                        for (let i = 0; i < productList.length; i++) {
                            tableContent += `
                                    <div class="col-12 col-sm-6 col-lg-4 mb-4">
                                        <div class="product-card">
                                            <div class="product-image">
                                                <img src="https://i.pinimg.com/736x/52/a9/89/52a989b36d5fb069dbbd41ae4d7bb0f9.jpg"
                                                     alt="Product">
                                            </div>

                                            <div class="product-info">
                                                <h5>${productList[i].productName}</h5>
                                                <p>${productList[i].description}</p>

                                                <div class="product-bottom">
                                                    <span class="product-price">
                                                        ${productList[i].price} ₸
                                                    </span>

                                                    <button class="product-add-btn"
                                                            onclick="openProductDetailsModal(${productList[i].id})">
                                                        +
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                }
                        document.getElementById("productList").innerHTML = tableContent;
                    }
                }
                httpRequest.send();
            }


            function openProductDetailsModal(id) {
                th:window.location.href = "/product-details?id=" + id;
            }

            //${#authentication.principal.fullName}


        </script>

    </div>
</html>

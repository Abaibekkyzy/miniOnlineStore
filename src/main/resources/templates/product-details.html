
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">

      <div layout:fragment="content">

          <div class="row mt-5 align-items-center">
              <div class="col-md-6">
                  <img id="productImage"
                       src="https://placehold.co/600x600/f5f1ec/211e1b?text=YEPSTORE"
                       class="img-fluid rounded"
                       alt="Product image">
              </div>

              <div class="col-md-6">
                  <p class="text-muted">YEPSTORE / PRODUCT</p>
                  <h1 id="productName" style="font-family: Georgia, serif;">
                    Loading...
                  </h1>

                  <p id="productDescription" class="text-muted mt-3"></p>
                  <p id="code" class="text-muted mt-3"></p>
                  <p id="productQuality" class="text-muted mt-3"></p>

                  <h3 id="productPrice" class="mt-4"></h3>

                  <button class="btn btn-dark mt-3 px-4 py-2"
                          onclick="addToCart()">
                    ADD TO CART +
                  </button>
              </div>
          </div>

          <script>
              const productId =
                    new URLSearchParams(window.location.search).get("id");

              let currentProduct;

                  fetch("/product/" + productId)
                      .then(response => {
                        if (!response.ok) {
                          throw new Error("Product not found");
                        }
                        return response.json();
                      })
                      .then(product => {
                        currentProduct = product;

                        document.getElementById("productName").textContent =
                                product.productName;

                        document.getElementById("productDescription").textContent =
                                "[ " + Number(product.code).toLocaleString("ru-RU") + " ] - " + product.description;

                        document.getElementById("productQuality").textContent =
                                Number(product.quantity).toLocaleString("ru-RU") + " шт осталось";

                        document.getElementById("productPrice").textContent =
                                Number(product.price).toLocaleString("ru-RU") + " ₸";
                      })
                      .catch(error => {
                        document.getElementById("productName").textContent =
                                "Product not found";
                        console.error(error);
                      });

              function addToCart() {
                if (!currentProduct) return;

                alert(currentProduct.productName + " — кейін корзинаға қосамыз 💗");
              }
          </script>

      </div>
</html>
